<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4338ca"/>
      <stop offset="100%" stop-color="#1e3a5f"/>
    </linearGradient>
  </defs>
  <!-- Globe -->
  <circle cx="16" cy="16" r="15" fill="url(#bg)"/>
  <!-- Grid lines -->
  <ellipse cx="16" cy="16" rx="15" ry="5" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="0.8"/>
  <ellipse cx="16" cy="16" rx="5" ry="15" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="0.8"/>
  <line x1="1" y1="16" x2="31" y2="16" stroke="rgba(255,255,255,0.2)" stroke-width="0.8"/>
  <line x1="16" y1="1" x2="16" y2="31" stroke="rgba(255,255,255,0.2)" stroke-width="0.8"/>
  <!-- Pin/marker dot -->
  <circle cx="16" cy="13" r="3" fill="#f43f5e"/>
